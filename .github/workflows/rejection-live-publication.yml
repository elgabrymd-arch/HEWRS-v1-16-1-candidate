name: Verify live rejection integration

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'runtime/outfit-refill-preview.js'
      - 'runtime/continuous-shirts-*.js'
      - 'runtime/avatar-v3-candidate-*.js'
      - 'CONTINUOUS_CANDIDATE.json'
      - 'AVATAR_V3_RELEASE.json'
      - 'AVATAR_V3_REVIEW_BUILD.json'
      - 'src/avatar-v3*.js'
      - 'data/avatar-v3-candidate.json'
      - 'data/issue22-*'
      - 'src/issue22-*'
      - 'src/continuous-shirts.js'
      - 'data/continuous-shirts*'
      - 'data/option-card-thumbnails.*'
      - 'tools/verify_active_delivery.py'
      - 'tests/five-round-photos-browser.py'
      - 'tests/five-round-state-browser.py'
      - 'tests/avatar_geometry_contract.py'
      - 'src/outfit-refill-*.js'
      - 'src/outfit-rejection*.js'
      - 'src/rejection-database.js'
      - 'src/owner-feedback.js'
      - 'src/reviewed-rejection-integration.js'
      - 'src/tie-*.js'
      - 'tests/rejection-live-publication.py'
      - 'tests/issue19-browser.py'
      - 'tests/issue22-browser.py'
      - 'tests/s06-neutral-*'
      - 'tests/issue19-b02-mask-fixtures.json'
      - 'tests/issue19-jacket-gap-fixtures.json'
      - 'tests/tie-reason-scope-browser.py'
      - 'tests/all-rejections-browser.py'
      - '.github/workflows/rejection-live-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hewrs-live-publication
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Configure checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install matching Playwright driver
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify published files and twenty consecutive rejection refills
        run: python tests/rejection-live-publication.py --publication-wait 600
      - name: Verify published S05 tie-only reasons and persistence in Chromium
        run: python tests/tie-reason-scope-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser chromium
      - name: Verify published S05 tie-only reasons and persistence in WebKit
        run: python tests/tie-reason-scope-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser webkit
      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_LIVE_REJECTION_PUBLICATION_EVIDENCE
          path: |
            evidence/rejection_publication/
            evidence/tie_reason_scope/
          if-no-files-found: error

  audit-all-rejections:
    needs: verify-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        section: [reasons, lifecycle]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install matching browser driver
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Audit all rejection controls on the verified publication
        run: python tests/all-rejections-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser '${{ matrix.browser }}' --section '${{ matrix.section }}'
      - name: Preserve live all-rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_LIVE_ALL_REJECTIONS_${{ matrix.browser }}_${{ matrix.section }}
          path: evidence/all_rejections/
          if-no-files-found: error
          retention-days: 30

  audit-live-photos-and-state:
    name: Retained photo contracts and current live saved state — ${{ matrix.browser }}
    needs: verify-live
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 95d14073e33f2b699bdb0cdbd42504b1a1be2274
          path: retained-issue19
      - name: Install matching browser and image audit drivers
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
      - name: Preserve original RGB, collar and tied-B06 photo contracts on their exact checkpoint
        working-directory: retained-issue19
        run: python tests/five-round-photos-browser.py --browser '${{ matrix.browser }}'
      - name: Verify published concurrent saves and cancellation
        run: python tests/five-round-state-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser '${{ matrix.browser }}'
      - name: Preserve live photo and state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_LIVE_TOTAL_${{ matrix.browser }}
          path: |
            evidence/five_round_20261119/browser/
            retained-issue19/evidence/five_round_20261119/browser/
          if-no-files-found: error
          retention-days: 30

  audit-live-issue19-fit:
    name: Live retained geometries and historical B06 — ${{ matrix.browser }}
    needs: verify-live
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original B06 RGB and tied-eligibility contract
        uses: actions/checkout@v4
        with:
          ref: 95d14073e33f2b699bdb0cdbd42504b1a1be2274
          path: retained-issue19
      - name: Install matching browser and image drivers
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
      - name: Verify every shirt on unchanged live suit and blazer geometries
        run: |
          for mode in S02 S03 B02 B15; do
            python tests/issue19-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser '${{ matrix.browser }}' --suite shirts --shards 1 --only-mode "$mode" --output "evidence/issue19/live-fit/$mode"
          done
      - name: Retain all original B06 shirt and tie assertions against their exact checkpoint
        working-directory: retained-issue19
        run: python tests/issue19-browser.py --browser '${{ matrix.browser }}' --suite shirts --shards 1 --only-mode B06 --output evidence/issue19/retained-B06
      - name: Preserve actual live fit reports and detail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_LIVE_ISSUE19_FIT_${{ matrix.browser }}
          path: |
            evidence/issue19/live-fit/**/RESULT.json
            evidence/issue19/live-fit/**/VISUAL_REVIEW_INDEX.json
            evidence/issue19/live-fit/**/phone/
            evidence/issue19/live-fit/**/collar/
            evidence/issue19/live-fit/**/shoulders/
            evidence/issue19/live-fit/**/cuffs/
            evidence/issue19/live-fit/**/tie/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve explicitly historical B06 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HEWRS_RETAINED_ISSUE19_B06_${{ matrix.browser }}
          path: retained-issue19/evidence/issue19/retained-B06/
          if-no-files-found: error
          retention-days: 30

  audit-live-issue22:
    name: Live current materials, S06 DNA and all contexts — ${{ matrix.browser }} — ${{ matrix.shard }}
    needs: verify-live
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install matching browser and image drivers
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0 numpy==2.2.6
      - name: Verify actual live corrected garments, S06 image bytes and neutral scoring semantics
        run: python tests/issue22-browser.py --url https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/ --browser '${{ matrix.browser }}' --shard '${{ matrix.shard }}' --shards 2 --output evidence/issue22/live
      - name: Preserve current live material, eligibility and pixel evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HEWRS_LIVE_ISSUE22_${{ matrix.browser }}_${{ matrix.shard }}
          path: evidence/issue22/live/
          if-no-files-found: error
          retention-days: 30
