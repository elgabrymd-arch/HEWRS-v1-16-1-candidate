name: HEWRS avatar V3 isolated source survey

on:
  push:
    branches:
      - feat/avatar-v3-proportions-pose-20261120
    paths:
      - 'tools/analyze_avatar_v3.py'
      - '.github/workflows/avatar-v3-candidate.yml'
      - 'tools/build_avatar_v3.py'
      - 'tools/build_avatar_v3_candidate.py'
      - 'src/avatar-v3.js'
      - 'src/avatar-v3-pose.js'
      - 'tests/avatar-v3*'
  workflow_dispatch:

concurrency:
  group: avatar-v3-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  isolated-source-and-pose-geometry:
    name: Inspect immutable V2 asset before designing V3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.3.5
      - name: Analyze frozen avatar source and source asset registrations
        run: python tools/analyze_avatar_v3.py
      - name: Build source-locked V3 head and wrist candidate (not installed)
        run: python tools/build_avatar_v3.py --write
      - name: Publish a small side-by-side preview for visual inspection
        run: |
          python - <<'PY'
          import base64, io
          from PIL import Image
          from PIL import ImageDraw
          left = Image.open('assets/a4dd223fa59824df6b96af01e37d10b70a35e77fa7cb942d2356e3008e00aa3d.png').convert('RGBA')
          right = Image.open('evidence/avatar_v3/avatar-v3.png').convert('RGBA')
          sheet = Image.new('RGB',(992,800),'#eeeeee')
          for n, im in enumerate((left,right)):
              tile = Image.new('RGBA',(496,800),'#eeeeee')
              tile.alpha_composite(im.crop((250,0,746,800)))
              sheet.paste(tile.convert('RGB'),(n*496,0))
          ImageDraw.Draw(sheet).text((12,12),'V2 original',fill='black',stroke_width=2,stroke_fill='white')
          ImageDraw.Draw(sheet).text((508,12),'V3 candidate',fill='black',stroke_width=2,stroke_fill='white')
          sheet.save('evidence/avatar_v3/head-neck-closeup.png',format='PNG',optimize=True)
          sheet.thumbnail((800,650))
          buf = io.BytesIO()
          sheet.save(buf, format='PNG', optimize=True)
          print('AVATAR_V3_PREVIEW_B64='+base64.b64encode(buf.getvalue()).decode())
          PY
      - name: Assert no modification to V2, wardrobe, app or stored-state logic
        run: |
          git diff --exit-code HEAD -- assets/ assemblies/ data/inputs.json data/inputs.js src/ runtime/ index.html app.html
          git status --short
      - name: Build and verify separate AVATAR_V3 preview app
        run: |
          node --check src/avatar-v3-pose.js
          node --check src/avatar-v3.js
          python tools/build_avatar_v3_candidate.py --write
          python tools/build_avatar_v3_candidate.py
          python - <<'PY'
          import json, subprocess
          m=json.load(open('AVATAR_V3_REVIEW_BUILD.json'))
          subprocess.run(['node','--check',m['runtime']],check=True)
          print('ISOLATED_V3_ENTRYPOINT='+m['preview_entrypoint'])
          PY
      - name: Save only the 3 derived V3 sources and manifest to the isolated branch
        if: github.event_name == 'push' && github.ref_name == 'feat/avatar-v3-proportions-pose-20261120'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/avatar-v3-candidate.json
          git add AVATAR_V3_REVIEW_BUILD.json avatar-v3-review.html
          python - <<'PY'
          import json, subprocess
          m=json.load(open('AVATAR_V3_REVIEW_BUILD.json'))
          subprocess.run(['git','add','--',m['runtime']],check=True)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/avatar-v3-candidate.json').read_text())
          with open('/tmp/hewrs-v3-asset-add.txt','w') as f:
              for row in d['candidate_layers'].values():
                  target=Path(row['url'])
                  assert target.exists() and target.name == row['sha256']+'.png'
                  f.write(str(target)+'\n')
          PY
          while IFS= read -r file; do git add -- "$file"; done < /tmp/hewrs-v3-asset-add.txt
          git diff --cached --quiet || {
            git commit -m 'Store isolated V3 avatar/head and wrist candidates'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
      - name: Publish isolated visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_AVATAR_V3_SOURCE_SURVEY
          path: |
            evidence/avatar_v3/
            data/avatar-v3-candidate.json
            AVATAR_V3_REVIEW_BUILD.json
            avatar-v3-review.html
            runtime/avatar-v3-candidate-*.js
          if-no-files-found: error
          retention-days: 30

  compare-v2-v3-browser:
    name: Compare real V2 and V3 outfits in ${{ matrix.browser }}
    needs: isolated-source-and-pose-geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install browser/image review driver
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: HEWRS_AVATAR_V3_SOURCE_SURVEY
          path: .
      - name: Verify V2 and V3 complete outfits, source integrity and unchanged storage
        run: python tests/avatar-v3-browser.py --browser '${{ matrix.browser }}'
      - name: Preserve actual full-outfit image comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_AVATAR_V3_BROWSER_${{ matrix.browser }}
          path: evidence/avatar_v3/browser/
          if-no-files-found: error
          retention-days: 30
