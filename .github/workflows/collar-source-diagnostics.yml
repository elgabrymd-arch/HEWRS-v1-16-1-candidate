name: Isolated collar-source diagnostics

on:
  push:
    branches: [fix/collar-visual-candidate-20261120]
    paths:
      - 'tools/collar_source_diagnostics.py'
      - '.github/workflows/collar-source-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  priority-collar-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify registered assets and create collar baseline previews
        run: python tools/collar_source_diagnostics.py
      - name: Upload collar-only diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_COLLAR_DIAGNOSTIC_NOT_APPROVED
          path: evidence/collar_candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Save preview only on isolated development branch
        if: github.ref == 'refs/heads/fix/collar-visual-candidate-20261120'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add evidence/collar_candidate/REPORT.json evidence/collar_candidate/PRIORITY_COLLARS_BASELINE.png
          if ! git diff --staged --quiet; then
            git commit -m "evidence: capture isolated collar baselines [skip ci]"
            git push origin HEAD:fix/collar-visual-candidate-20261120
          fi
