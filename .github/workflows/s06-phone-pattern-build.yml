name: S06 mobile pattern release-asset build

on:
  push:
    branches: [fix/s06-phone-pattern-20261122]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s06-mobile-material-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[s06 assets generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch retained source and release checkpoints
        run: |
          git fetch --depth=1 origin 95d14073e33f2b699bdb0cdbd42504b1a1be2274
          git fetch --depth=1 origin f114d7dbedab3430761a29d77328ae80ac0882e4
          git fetch --depth=1 origin 1d5529c4a1a2f87b1212ac68392af1b4dc87d7bb
          git fetch --depth=1 origin f3c3a10151c9fb9d7868c50b52f9cf7f33cc02f9
      - name: Install pinned dependencies
        run: |
          npm install --prefix /tmp/hewrs-issue22-deps --no-audit --no-fund fake-indexeddb@6.2.8 @napi-rs/canvas@0.1.100
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Remember old current S06 generated paths
        run: |
          node -e "const a=require('./data/issue22-materials.json'),p=require('./data/issue22-picker-images.json');for(const row of Object.values(a.bindings))if(row.garment_id==='S06')console.log(row.display_url);console.log(p.items.S06.src)" > "$RUNNER_TEMP/s06-old-paths"
      - name: Regenerate current material, reviewed records and published runtime
        env:
          NODE_PATH: /tmp/hewrs-issue22-deps/node_modules
        run: |
          node tools/build_issue22_materials.cjs
          node tools/build_issue22_index.cjs
          node tools/build_issue22_reviewed.cjs
          node tools/build_issue22_previews.cjs
          python tools/integrate_avatar_v3.py --write
      - name: Stage only registered new S06 assets and regenerated delivery
        run: |
          node -e "const a=require('./data/issue22-materials.json'),p=require('./data/issue22-picker-images.json'),r=require('./AVATAR_V3_RELEASE.json');for(const row of Object.values(a.bindings))if(row.garment_id==='S06')console.log(row.display_url);console.log(p.items.S06.src);console.log(r.runtime);console.log(r.issue22.reviewed_panel.path)" > "$RUNNER_TEMP/s06-new-paths"
          while IFS= read -r old; do
            if ! grep -Fxq "$old" "$RUNNER_TEMP/s06-new-paths"; then
              git rm -f -- "$old"
            fi
          done < "$RUNNER_TEMP/s06-old-paths"
          git add -u
          while IFS= read -r current; do
            git add -f -- "$current"
          done < "$RUNNER_TEMP/s06-new-paths"
          # The frozen original source includes one trailing space in its
          # compiled runtime; byte-exact regeneration must retain it.
          # Content hashes and source-lock tests provide the release gate.
          git status --short
      - name: Validate perceptibility, source locking, preserved avatar and runtime
        env:
          NODE_PATH: /tmp/hewrs-issue22-deps/node_modules
        run: |
          node tests/s06-neutral-material.cjs
          node --expose-gc tests/issue22-materials.cjs
          python tools/verify_active_delivery.py --check --syntax
          python tests/issue22-source.py
          python tests/issue22-source-lock.py
      - name: Commit independently validated generated delivery to this fix branch
        run: |
          if git diff --cached --quiet; then
            echo "No generated changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build source-locked S06 phone-visible fabric and picker [s06 assets generated]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-phone-pattern-build-evidence
          path: |
            evidence/s06-neutral-20261122/
            evidence/issue22/material-tests.json
          if-no-files-found: ignore
          retention-days: 14
