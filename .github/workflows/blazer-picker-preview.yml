name: Blazer photo selector preview checks
on:
  push:
    branches: [feature/blazer-photo-selector-20261116]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright==1.58.0 Pillow==12.1.0
          python -m playwright install --with-deps chromium
      - name: Verify accepted Standard and reproduce opt-in preview
        run: |
          python tools/build.py
          python tools/build_blazer_picker_preview.py
          git diff --exit-code
          node --check src/blazer-picker-preview.js
      - name: Exercise image identities and desktop/mobile picker behavior
        run: python tests/blazer-picker-preview-browser.py --output preview-verification
      - name: Export approved B15 on the frozen native avatar
        run: python tools/export_b15_picker_avatar.py --output preview-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HEWRS_BLAZER_PICKER_PREVIEW_VERIFICATION
          path: preview-verification/
          if-no-files-found: ignore
          retention-days: 3
