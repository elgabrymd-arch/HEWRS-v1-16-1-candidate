name: S05 tie reason rejection regression
on:
  push:
    branches:
      - fix/tie-only-rejection-20261118
  workflow_dispatch:
    inputs:
      live_mode:
        description: Live verification mode
        type: choice
        options:
          - legacy
          - fixed
          - skip
        default: legacy
      live_url:
        description: HEWRS live URL
        type: string
        default: https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/
permissions:
  contents: read
concurrency:
  group: tie-reason-scope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.browser == 'chromium'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candidate build and unchanged wardrobe/avatar assets
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin f745df827dfc79aea52f816219fbcf68cbc510ae
          git diff --exit-code f745df827dfc79aea52f816219fbcf68cbc510ae -- assets assemblies data vendor ui ui-assets STANDARD_RELEASE.json outfit-feedback.js tools/build.py
          python tools/build_tie_candidate.py --check
      - name: Verify native tie-only replacement and scope regressions
        if: matrix.browser == 'chromium'
        run: |
          node tests/tie-only-replacement.cjs
          node tests/tie-feedback.cjs
      - name: Install matching browser driver
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify S05 dark-navy tie reason paths, refill and reload
        run: python tests/tie-reason-scope-browser.py --browser '${{ matrix.browser }}'
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_TIE_REASON_FIXED_${{ matrix.browser }}
          path: evidence/tie_reason_scope/
          if-no-files-found: warn
          retention-days: 14
  baseline-and-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f745df827dfc79aea52f816219fbcf68cbc510ae
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching browser driver
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Characterize the original release without changing it
        run: |
          cp tests/tie-reason-scope-browser.py baseline/tests/tie-reason-scope-browser.py
          python baseline/tests/tie-reason-scope-browser.py --expect-legacy
      - name: Characterize actual published release
        if: github.event_name == 'push' || inputs.live_mode == 'legacy'
        env:
          HEWRS_TEST_URL: ${{ inputs.live_url || 'https://elgabrymd-arch.github.io/HEWRS-v1-16-1-candidate/' }}
        run: python tests/tie-reason-scope-browser.py --url "$HEWRS_TEST_URL" --expect-legacy
      - name: Verify the fixed live release when requested
        if: github.event_name == 'workflow_dispatch' && inputs.live_mode == 'fixed'
        env:
          HEWRS_TEST_URL: ${{ inputs.live_url }}
        run: python tests/tie-reason-scope-browser.py --url "$HEWRS_TEST_URL"
      - name: Save baseline and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_TIE_REASON_BASELINE_LIVE
          path: |
            baseline/evidence/tie_reason_scope/
            evidence/tie_reason_scope/
          if-no-files-found: warn
          retention-days: 14
