name: HEWRS AVATAR_V3 isolated application state and rejection audit

on:
  push:
    branches: [feat/avatar-v3-proportions-pose-20261120]
    paths:
      - 'src/avatar-v3*.js'
      - 'tests/avatar-v3*'
      - 'avatar-v3-review.html'
      - 'AVATAR_V3_REVIEW_BUILD.json'
      - 'runtime/avatar-v3-candidate-*.js'
      - '.github/workflows/avatar-v3-app-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-v3-preservation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-native-state-and-rejections:
    name: Native preview state and rejection regression — ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install existing native regression driver
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
      - name: Verify exact isolated entrypoint and source integrity
        run: |
          python tools/build_avatar_v3_candidate.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=json.loads(Path('AVATAR_V3_REVIEW_BUILD.json').read_text())
          assert d['app_production_entrypoints_unchanged']
          assert hashlib.sha256(Path(d['runtime']).read_bytes()).hexdigest()==d['runtime_sha256']
          print('VERIFIED_V3_PREVIEW='+d['preview_entrypoint'])
          PY
      - name: Start private browser server and verify all saved-state and rejection routes
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/v3-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python tests/five-round-state-browser.py --url http://127.0.0.1:8765/avatar-v3-review.html --browser '${{ matrix.browser }}'
          python tests/tie-reason-scope-browser.py --url http://127.0.0.1:8765/avatar-v3-review.html --browser '${{ matrix.browser }}'
          python tests/all-rejections-browser.py --url http://127.0.0.1:8765/avatar-v3-review.html --browser '${{ matrix.browser }}' --section reasons
          python tests/all-rejections-browser.py --url http://127.0.0.1:8765/avatar-v3-review.html --browser '${{ matrix.browser }}' --section lifecycle
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_AVATAR_V3_PROTECTED_STATE_${{ matrix.browser }}
          path: |
            evidence/five_round_20261119/browser/
            evidence/tie_reason_scope/
            evidence/all_rejections/
          if-no-files-found: warn
          retention-days: 30
