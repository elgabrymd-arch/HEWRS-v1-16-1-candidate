name: Rejection database and search integration
on:
  push:
    branches:
      - integration/rejection-storage-search-20261118
    paths:
      - .github/workflows/rejection-storage-integration.yml
      - src/rejection-database.js
      - src/outfit-refill-application.js
      - src/outfit-refill-engine.js
      - src/outfit-rejection-core.js
      - src/outfit-rejection-ui.js
      - src/reviewed-rejection-integration.js
      - runtime/outfit-refill-preview.js
      - index.html
      - app.html
      - tools/build_tie_candidate.py
      - tests/rejection-database.cjs
      - tests/rejection-search-expansion.cjs
      - tests/rejection-storage-browser.py
      - tests/rejection-database-read-failure-browser.py
      - tests/rejection-database-healthy-browser.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rejection-storage-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-browser-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch verified candidate and original build bases
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin b9e33124d15c0f7127f2b2eb61dd710ec9edd05f
          git fetch --depth=1 origin febe4148fc0b27ee2018d84408714ee1fe712015
      - name: Verify preserved wardrobe, avatar, scoring and Standard application
        run: |
          git diff --exit-code b9e33124d15c0f7127f2b2eb61dd710ec9edd05f -- assets assemblies data vendor ui ui-assets STANDARD_RELEASE.json outfit-feedback.js hewrs-stage10-integration-panel.js feedback-candidate tools/build.py
          git diff --exit-code b9e33124d15c0f7127f2b2eb61dd710ec9edd05f -- src ':!src/rejection-database.js' ':!src/outfit-refill-application.js' ':!src/outfit-refill-engine.js' ':!src/outfit-rejection-core.js' ':!src/outfit-rejection-ui.js' ':!src/reviewed-rejection-integration.js'
          git diff --exit-code b9e33124d15c0f7127f2b2eb61dd710ec9edd05f -- runtime ':!runtime/outfit-refill-preview.js'
          python tools/build_tie_candidate.py --verify-base --check
          node --check runtime/outfit-refill-preview.js
          node --check src/rejection-database.js
          node --check src/reviewed-rejection-integration.js
      - name: Install isolated database test dependency
        timeout-minutes: 5
        run: npm install --prefix /tmp/hewrs-test-deps --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.8
      - name: Install browser test driver
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify database, migration, transactions and original rejection semantics
        env:
          NODE_PATH: /tmp/hewrs-test-deps/node_modules
        run: |
          node tests/rejection-database.cjs
          node tests/rejection-read-failure.cjs
          node tests/tie-feedback.cjs
          node tests/tie-exposure.cjs
          node tests/rejection-cumulative-refill.cjs
          node tests/rejection-same-generation-guard.cjs
      - name: Verify actual engine search expansion and retained options
        run: node tests/rejection-search-expansion.cjs
      - name: Build validated synthetic 30,000-record browser fixture
        run: node tests/rejection-scale-audit.cjs --fixture-only
      - name: Verify async database integration retains failure and recovery protections
        run: python tests/rejection-database-read-failure-browser.py
      - name: Verify healthy generation, tie rejection, refill, Undo and backup integration
        run: python tests/rejection-database-healthy-browser.py
      - name: Verify 30,000 active bans, migration, backup, concurrency and 20 native UI refills in Chromium
        run: python tests/rejection-storage-browser.py --browser chromium
      - name: Verify the same storage and refill integration in WebKit
        run: python tests/rejection-storage-browser.py --browser webkit
      - name: Save test evidence without deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEWRS_REJECTION_STORAGE_INTEGRATION_EVIDENCE
          path: |
            evidence/rejection_storage/
            evidence/rejection_search/
          if-no-files-found: warn
          retention-days: 14
