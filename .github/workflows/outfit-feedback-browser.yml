name: Outfit feedback real-application browser checks
on:
  push:
    branches: [feature/blazer-photo-selector-20261116]
    paths:
      - '.github/workflows/outfit-feedback-browser.yml'
      - 'tests/outfit-feedback-real-browser.py'
      - 'src/outfit-*'
      - 'outfit-feedback-preview.html'
permissions:
  contents: read
jobs:
  actual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing pinned browser test dependency
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Reproduce Generate on the actual app and hosted preview
        run: python tests/outfit-feedback-real-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HEWRS_OUTFIT_FEEDBACK_REAL_BROWSER
          path: rejection-verification/
          retention-days: 3
